[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inertia-client"
version = "0.2.2"
description = "Submit labels to the inertia challenge, a scoreboard for k-means"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Arthur Lacote" }]
keywords = ["k-means", "clustering", "benchmark", "inertia"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = ["inertia-scorer>=0.2.0", "numpy"]

[project.urls]
Homepage = "https://github.com/cakedev0/the-inertia-challenge"
Issues = "https://github.com/cakedev0/the-inertia-challenge/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
inertia-client = "inertia_client.client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inertia_client"]
