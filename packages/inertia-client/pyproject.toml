[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inertia-client"
version = "0.1.0"
description = "Submit labels to the inertia challenge, a scoreboard for k-means"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["inertia-scorer", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
inertia-client = "inertia_client.client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inertia_client"]
