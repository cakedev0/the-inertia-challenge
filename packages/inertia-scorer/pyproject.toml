[build-system]
requires = ["setuptools>=77", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inertia-scorer"
version = "0.2.0"
description = "Datasets and scoring of the inertia challenge, a scoreboard for k-means"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Arthur Lacote" }]
keywords = ["k-means", "clustering", "benchmark", "inertia"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy", "scipy"]

[project.urls]
Homepage = "https://github.com/cakedev0/the-inertia-challenge"
Issues = "https://github.com/cakedev0/the-inertia-challenge/issues"

[project.optional-dependencies]
download = ["h5py", "pandas", "pyarrow", "scikit-learn"]
test = ["pytest"]

[project.scripts]
inertia-score = "inertia_scorer.score:main"
inertia-download = "inertia_scorer.download:main"
inertia-listener = "inertia_scorer.listener:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
test-requires = ["pytest"]
test-command = "pytest {package}/tests -q -p no:cacheprovider"
