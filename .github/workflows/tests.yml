name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "packages/inertia-scorer[test]" -e packages/inertia-client ruff
      - run: ruff check . && ruff format --check .
        if: runner.os == 'Linux'
      - run: pytest
